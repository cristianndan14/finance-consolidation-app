name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Sin llamadas al LLM real en CI: los tests usan el adapter fake con cassettes.
  LLM_PROVIDER: fake

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra dev

      - name: Guardas de seguridad
        run: |
          uv run python scripts/check_service_role.py
          uv run python scripts/check_local_config.py

      - name: Lint
        run: uv run ruff check app tests

      - name: Format
        run: uv run ruff format --check app tests

      - name: Types
        run: uv run mypy app

      - name: Tests unitarios
        run: uv run pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql+asyncpg://app_runtime:app_runtime_ci@127.0.0.1:5432/postgres
      APP_RUNTIME_PASSWORD: app_runtime_ci
      SESSION_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra dev

      # Aplica las MISMAS migraciones que produccion, en orden.
      - name: Migraciones
        run: uv run python -m app.cli migrate --url "$MIGRATION_DATABASE_URL"

      # El test que cierra el aislamiento entre usuarios. Si esto falla, no se mergea.
      - name: Aislamiento RLS
        run: uv run pytest tests/integration/test_rls_isolation.py -v

      - name: Integracion
        run: uv run pytest tests/integration -q
